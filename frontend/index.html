<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Log Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; color: #222; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    textarea { width: 100%; height: 220px; margin-top: 10px; font-family: monospace; }
    button { padding: 10px 16px; margin-top: 12px; cursor: pointer; }
    pre { background: #111; color: #eee; padding: 16px; border-radius: 8px; overflow: auto; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; background: #eee; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Log Analyzer Platform</h1>
    <p>DevOps/security project: analyze authentication logs, detect suspicious activity, expose API metrics, and optionally generate AI-assisted summaries.</p>
    <span class="badge">Python</span><span class="badge">FastAPI</span><span class="badge">Docker</span><span class="badge">Prometheus</span><span class="badge">AI Automation</span>

    <h2>Paste logs</h2>
    <textarea id="logs">May 19 10:00:01 server sshd[123]: Failed password for invalid user admin from 192.168.1.44 port 52211 ssh2
May 19 10:00:05 server sshd[123]: Failed password for invalid user admin from 192.168.1.44 port 52212 ssh2
May 19 10:00:09 server sshd[123]: Failed password for invalid user admin from 192.168.1.44 port 52213 ssh2
May 19 10:00:15 server sshd[123]: Accepted password for admin from 192.168.1.44 port 52214 ssh2</textarea>
    <br />
    <label><input type="checkbox" id="useAi" /> Use AI summary if Ollama is running</label>
    <br />
    <button onclick="analyze()">Analyze Logs</button>

    <h2>Result</h2>
    <pre id="result">Waiting for analysis...</pre>
  </div>

  <script>
    async function analyze() {
      const content = document.getElementById('logs').value;
      const use_ai = document.getElementById('useAi').checked;
      const res = await fetch('http://localhost:8000/analyze-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, use_ai })
      });
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
